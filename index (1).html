<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#064A3F">
<meta name="color-scheme" content="light dark">
<title>সমিতির হিসাব</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
/* Layout: sticky top bar (society name + switcher), one page at a time in the middle, bottom tab bar. */
:root {
  --bg: #EDF1F0;
  --surface: #FFFFFF;
  --surface-2: #F5F8F7;
  --ink: #0F2420;
  --muted: #5B6F69;
  --line: #D9E2DF;
  --accent: #0B6B5C;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEFE9;
  --hero-a: #0E7A68;
  --hero-b: #064A3F;
  --hero-ink: #FFFFFF;
  --gold: #B8892B;
  --ok: #17794B;
  --ok-soft: #DDF1E5;
  --due: #A94A17;
  --due-soft: #F8E6DA;
  --shadow: 0 1px 2px rgba(15,36,32,.06), 0 6px 18px rgba(15,36,32,.06);
  --font-display: "Anek Bangla", "Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif;
  --font-body: "Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0A1311; --surface: #121F1C; --surface-2: #0F1A18; --ink: #E6EFEC; --muted: #98ADA6; --line: #23382F;
    --accent: #5BC9B6; --accent-ink: #06201A; --accent-soft: #17332E;
    --hero-a: #2E8F7E; --hero-b: #164F45; --hero-ink: #F2FBF8;
    --gold: #E2B867;
    --ok: #6BD39B; --ok-soft: #163626; --due: #F0A06B; --due-soft: #3A2519;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.28);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px));
}
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
.wrap { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.appbar { position: sticky; top: 0; z-index: 20; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); border-bottom: 1px solid transparent; }
.appbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 12px; padding-bottom: 10px; }
.brand { min-width: 0; display: flex; flex-direction: column; }
.brand small { color: var(--muted); font-size: 13px; line-height: 1.2; }
.brand h1 { font-size: 22px; font-weight: 800; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.soc-select { max-width: 150px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); padding: 4px 10px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); white-space: nowrap; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.live.on i { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }

/* views */
#view { display: flex; flex-direction: column; gap: 22px; padding-top: 8px; padding-bottom: 8px; }
@media (prefers-reduced-motion: no-preference) {
  #view > * { animation: rise .28s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .bar b { transition: width .5s ease; }
  .ring circle.v { transition: stroke-dashoffset .6s ease; }
}
.page-title { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.page-title h2 { font-size: 24px; font-weight: 800; line-height: 1.2; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
.pad { padding: 16px; }
.sec-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.sec-h h3 { font-size: 18px; font-weight: 700; }
.link { background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 14px; padding: 4px 0; }

/* hero */
.hero { border-radius: 20px; padding: 22px 20px; color: var(--hero-ink); background: linear-gradient(145deg, var(--hero-a), var(--hero-b)); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; border: 22px solid rgba(255,255,255,.07); }
.hero .lbl { font-size: 15px; opacity: .85; }
.hero .big { font-family: var(--font-display); font-weight: 800; font-size: 46px; line-height: 1.1; overflow-wrap: anywhere; }
.hero .last { font-size: 14px; opacity: .85; }
.hero .gold { display: block; width: 44px; height: 3px; border-radius: 3px; background: var(--gold); margin: 6px 0 2px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat .lbl { font-size: 14px; color: var(--muted); }
.stat .val { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.25; overflow-wrap: anywhere; }
.stat .val small { font-weight: 500; font-size: 14px; color: var(--muted); }
.stat.warn .val { color: var(--due); }
.ringbox { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
.ring { width: 64px; height: 64px; flex-shrink: 0; position: relative; }
.ring svg { width: 64px; height: 64px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 7; }
.ring circle.t { stroke: var(--accent-soft); }
.ring circle.v { stroke: var(--accent); stroke-linecap: round; }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.bar { height: 6px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; margin-top: 4px; }
.bar b { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

/* lists */
.list { list-style: none; margin: 0; padding: 0; overflow: hidden; }
.row { padding: 12px 16px; display: grid; gap: 10px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.line1 { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; }
.who { min-width: 0; display: flex; align-items: center; gap: 12px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 17px; flex-shrink: 0; }
.who .txt { min-width: 0; display: flex; flex-direction: column; }
.who .name { font-weight: 600; overflow-wrap: anywhere; }
.who .meta { font-size: 13px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border-radius: 99px; font-size: 14px; font-weight: 500; background: var(--surface-2); color: var(--muted); white-space: nowrap; border: 1px solid var(--line); }
.pill.paid { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.due { background: var(--due-soft); color: var(--due); border-color: transparent; }
.acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.btn { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 500; }
.btn:hover { background: var(--accent-soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--due); border-color: var(--due); background: transparent; }
.btn.danger.solid { background: var(--due); color: var(--bg); border-color: var(--due); }
.btn:disabled { opacity: .5; cursor: default; filter: none; }
.field { padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); min-width: 0; }
.field.amt { width: 110px; }
.empty { padding: 28px 18px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty strong { display: block; color: var(--ink); font-family: var(--font-display); font-size: 18px; }
.hint { font-size: 13px; color: var(--muted); }
.nav { display: inline-flex; align-items: center; gap: 6px; }
.nav .cur { min-width: 118px; text-align: center; font-weight: 600; }
.ibtn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 20px; line-height: 1; }
.ibtn:hover { background: var(--accent-soft); }
.tbtn { padding: 7px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; }

/* ledger table */
.scroll { overflow-x: auto; }
table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 880px; font-size: 14px; }
th, td { padding: 9px 8px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
tbody tr:last-child td, tfoot td { border-bottom: 0; }
thead th { font-weight: 600; color: var(--muted); background: var(--surface); }
th button { background: none; border: 0; padding: 0; color: inherit; font-weight: inherit; }
th:first-child, td:first-child { position: sticky; left: 0; text-align: left; background: var(--surface); z-index: 1; padding-left: 14px; min-width: 112px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
td.paid { color: var(--ok); font-weight: 500; }
td.due { color: var(--due); background: var(--due-soft); font-size: 12px; }
td.na { color: var(--line); }
th.cur, td.cur { box-shadow: inset 0 0 0 9999px color-mix(in srgb, var(--accent) 7%, transparent); }
td.tot { font-weight: 600; }
tfoot td { font-weight: 600; border-top: 2px solid var(--line); }
.tag { font-size: 11px; font-weight: 500; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; margin-left: 6px; }

/* forms */
.form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
.form .field { color: var(--ink); }
.check { flex-direction: row !important; align-items: center; gap: 8px !important; font-size: 14px !important; color: var(--ink) !important; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.danger-zone { border-color: color-mix(in srgb, var(--due) 45%, var(--line)); }
.danger-zone h3 { color: var(--due); }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.soc { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
.soc:first-of-type { border-top: 0; }

/* tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -6px 20px rgba(15,36,32,.06); }
.tabs .in { max-width: 880px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tab { background: none; border: 0; padding: 8px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); position: relative; }
.tab svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab.on { color: var(--accent); font-weight: 600; }
.tab.on::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--gold); }

#toast { position: fixed; left: 0; right: 0; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: flex; justify-content: center; padding: 0 16px; pointer-events: none; }
#toast span { background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 15px; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 100%; }

@media (max-width: 480px) {
  .hero .big { font-size: 40px; }
  .brand h1 { font-size: 20px; }
  .soc-select { max-width: 120px; }
}
</style>
</head>
<body>

  <div class="wrap">
    <div class="brand"><small>মাসিক জমার হিসাব</small><h1 id="society-name">সমিতির হিসাব</h1></div>
    <div class="bar-right">
      <select class="soc-select" id="soc-select" aria-label="সমিতি বদলান" hidden></select>

</header>
<main class="wrap" id="view"></main>
<nav class="tabs" aria-label="প্রধান মেনু"><div class="in" id="tabs"></div></nav>

      db = firebase.firestore(); auth = firebase.auth();

    } catch (e) { S.err = 'Firebase চালু করা যায়নি। firebase-config.js ফাইলের তথ্য ঠিক আছে কিনা দেখুন।'; renderAll(); return; }

    auth.onAuthStateChanged(function (u) { S.canEdit = !!u; if (!u) { S.showAdd = false; S.em = null; S.editRow = null; S.confirm = null; } checkLegacy(); schedule(); });
    db.collection('societies').onSnapshot(function (snap) {
      S.societies = snap.docs.map(function (d) {
        var x = d.data() || {};
        return { id: d.id, name: String(x.name || 'সমিতি'), createdAt: Number(x.createdAt) || 0 };
      }).sort(function (a, b) { return a.createdAt - b.createdAt; });
      S.ready.s = true; S.err = '';
      var ids = S.societies.map(function (s) { return s.id; }), saved = lsGet('somiti_sid');
      var want = S.sid && ids.indexOf(S.sid) >= 0 ? S.sid : (saved && ids.indexOf(saved) >= 0 ? saved : (ids[0] || null));
      if (want !== S.sid) { S.sid = want; S.confirm = null; listenSociety(want); }
      checkLegacy(); schedule();
    }, onErr);
  }

  window.addEventListener('online', function () { S.online = true; schedule(); });
  window.addEventListener('offline', function () { S.online = false; schedule(); });
  window.addEventListener('hashchange', function () { var p = location.hash.slice(1); if (PAGES.indexOf(p) >= 0 && p !== S.page) { S.page = p; S.confirm = null; renderAll(); } });
  $('#soc-select').addEventListener('change', function (e) { selectSociety(e.target.value); });
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });

  var p0 = location.hash.slice(1); if (PAGES.indexOf(p0) >= 0) S.page = p0;
  renderAll();
  start();
})();
</script>
</body>
