<style>
:root {

    --accent: #5CCDB9; --accent-ink: #05201A; --accent-soft: #15322C;

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--ink);

}

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.appbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding-top: env(safe-area-inset-top, 0px); }

}
.page-title { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }

.hero { border-radius: 22px; padding: 22px 20px 18px; color: var(--hero-ink); background: radial-gradient(120% 120% at 100% 0%, rgba(255,255,255,.14), transparent 55%), linear-gradient(150deg, var(--hero-a), var(--hero-b)); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden; }

.hero .facts div { display: flex; flex-direction: column; gap: 1px; min-width: 0; padding: 0 10px; border-left: 1px solid rgba(255,255,255,.16); }
.hero .facts div:first-child { padding-left: 0; border-left: 0; }
.hero .facts span { font-size: 12.5px; opacity: .8; }
.hero .facts b { font-family: var(--font-display); font-size: 17px; font-weight: 700; overflow-wrap: anywhere; line-height: 1.3; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }

.stat.warn .val { color: var(--due); }
.stat.good .val { color: var(--ok); }
.ringbox { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
.ring { width: 64px; height: 64px; flex-shrink: 0; position: relative; }
.ring svg { width: 64px; height: 64px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 7; }
.ring circle.t { stroke: var(--accent-soft); }
.ring circle.v { stroke: var(--accent); stroke-linecap: round; }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.bar { height: 7px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; margin-top: 6px; }
.bar b { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

.bars { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; align-items: end; }
.col { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; }

.track { position: relative; width: 100%; height: 96px; }

.track .exp { background: var(--accent-soft); }
.track .got { background: var(--accent); }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); margin-top: 10px; }

.list { list-style: none; margin: 0; padding: 0; overflow: hidden; }
.row { padding: 13px 16px; display: grid; gap: 10px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.line1 { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; }

.who .name { font-weight: 600; overflow-wrap: anywhere; text-align: left; }

button.name { background: none; border: 0; padding: 0; font-weight: 600; }
.avatar { width: 42px; height: 42px; border-radius: 50%; background: hsl(var(--hue, 160) 38% var(--av-bg)); color: hsl(var(--hue, 160) 55% var(--av-fg)); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 17px; flex-shrink: 0; }
.avatar.lg { width: 56px; height: 56px; font-size: 23px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border-radius: 99px; font-size: 13.5px; font-weight: 500; background: var(--surface-2); color: var(--muted); white-space: nowrap; border: 1px solid var(--line); }
.pill.paid { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.due { background: var(--due-soft); color: var(--due); border-color: transparent; }
.pill.part { background: var(--part-soft); color: var(--part); border-color: transparent; }
.acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.btn { padding: 9px 15px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; line-height: 1.3; }
.btn:hover { background: var(--accent-soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--due); border-color: var(--due); background: transparent; }
.btn.danger.solid { background: var(--due); color: var(--bg); border-color: var(--due); }
.btn.wa { border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); color: var(--ok); }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; filter: none; }
.field { padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); min-width: 0; }
.field.amt { width: 120px; }
.empty { padding: 28px 18px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty strong { display: block; color: var(--ink); font-family: var(--font-display); font-size: 18px; }
.hint { font-size: 13px; color: var(--muted); }
.nav { display: inline-flex; align-items: center; gap: 6px; }
.nav .cur { min-width: 118px; text-align: center; font-weight: 600; }
.ibtn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 20px; line-height: 1; }
.ibtn:hover { background: var(--accent-soft); }
.tbtn { padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; }
.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; gap: 4px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.seg button { border: 0; background: none; padding: 7px 18px; border-radius: 10px; font-weight: 500; color: var(--muted); }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; }
.search input { width: 100%; padding-left: 38px; border-radius: 14px; background: var(--surface); }

.scroll { overflow-x: auto; }
table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 880px; font-size: 14px; }
th, td { padding: 10px 8px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
tbody tr:last-child td, tfoot td { border-bottom: 0; }
thead th { font-weight: 600; color: var(--muted); background: var(--surface); }
th button { background: none; border: 0; padding: 0; color: inherit; font-weight: inherit; }
th:first-child, td:first-child { position: sticky; left: 0; text-align: left; background: var(--surface); z-index: 1; padding-left: 14px; min-width: 112px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
td.paid { color: var(--ok); font-weight: 500; }
td.part { color: var(--part); background: var(--part-soft); font-weight: 500; }
td.due { color: var(--due); background: var(--due-soft); font-size: 12px; }
td.na { color: var(--line); }
th.cur, td.cur { box-shadow: inset 0 0 0 9999px color-mix(in srgb, var(--accent) 7%, transparent); }
td.tot { font-weight: 600; }
tfoot td { font-weight: 600; border-top: 2px solid var(--line); }
.tag { font-size: 11px; font-weight: 500; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; margin-left: 6px; }

.form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
.form .field { color: var(--ink); }
.check { flex-direction: row !important; align-items: center; gap: 8px !important; font-size: 14px !important; color: var(--ink) !important; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.danger-zone { border-color: color-mix(in srgb, var(--due) 45%, var(--line)); }
.danger-zone h3 { color: var(--due); }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.soc { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface-2); font-size: 13px; }
.chip:hover { background: var(--accent-soft); }
.preview { border-radius: 14px; background: var(--surface-2); border: 1px dashed var(--line); padding: 10px 14px; font-size: 14px; display: flex; flex-direction: column; gap: 3px; min-height: 44px; }
.preview .ok { color: var(--ok); } .preview .bad { color: var(--due); }
.okbox { background: var(--ok-soft); border-color: transparent; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.okbox strong { color: var(--ok); font-family: var(--font-display); }
.back { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 4px 0; }
.mhead { display: flex; align-items: center; gap: 14px; }
.mhead .txt { display: flex; flex-direction: column; min-width: 0; }
.mhead h2 { font-size: 22px; overflow-wrap: anywhere; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 0 12px calc(8px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.tabs .in { pointer-events: auto; max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px; gap: 2px; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 10px 30px rgba(14,34,29,.16); }
.tab { background: none; border: 0; padding: 7px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 11.5px; color: var(--muted); border-radius: 16px; }
.tab svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab.on { color: var(--accent); background: var(--accent-soft); font-weight: 600; }

#cards { position: fixed; inset: 0; z-index: 60; background: rgba(5,15,12,.92); overflow-y: auto; padding: calc(12px + env(safe-area-inset-top, 0px)) 12px 40px; }
#cards .cbar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 8px 0 12px; }
#cards .cimgs { display: flex; flex-direction: column; gap: 16px; align-items: center; }
#cards img { width: 100%; max-width: 520px; height: auto; border-radius: 14px; }
#toast { position: fixed; left: 0; right: 0; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 70; display: flex; justify-content: center; padding: 0 16px; pointer-events: none; }
#toast span { background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 15px; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 100%; }

@media (max-width: 480px) {
  .hero .big { font-size: 40px; }
  .bt h1 { font-size: 18px; }
  .soc-select { max-width: 112px; }
  .hero .facts b { font-size: 15px; }
}
</style>

    <div class="bar-right">
      <select class="soc-select" id="soc-select" aria-label="সমিতি বদলান" hidden></select>

    </div>
  </div>
</header>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="firebase-config.js"></script>
<script>

    f.append(h('div', { class: 'acts' },
      h('button', { class: 'btn primary', text: 'ফটোকার্ড বানান (' + fmt(n) + ' জন)', disabled: n ? null : true, onclick: makeAlertCards }),
      h('button', { class: 'btn', text: n === list.length ? 'সবাইকে বাদ দিন' : 'সবাইকে বাছুন', onclick: function () { list.forEach(function (x) { if (n === list.length) off[x.m.id] = true; else delete off[x.m.id]; }); renderAll(); } })));
    f.append(h('ul', { class: 'list card' }, list.map(function (x) {
      return h('li', { class: 'row' }, h('div', { class: 'line1' },
        h('label', { class: 'who check', style: 'cursor:pointer;display:flex' },
          h('input', { type: 'checkbox', checked: off[x.m.id] ? null : true, onchange: function (e) { if (e.target.checked) delete off[x.m.id]; else off[x.m.id] = true; renderAll(); } }),
          h('div', { class: 'txt' }, h('span', { class: 'name', text: x.m.name }),
            h('span', { class: 'meta num', text: x.o.list.slice(0, 3).map(function (e) { return SHORT[+e.month.slice(5) - 1] + ' ' + taka(e.due); }).join(' · ') + (x.o.list.length > 3 ? ' · আরও ' + fmt(x.o.list.length - 3) + ' মাস' : '') }))),
        pill('due', taka(x.o.total))));
    })));
    return f;
  }
  function alertCard() {
    if (!S.canEdit) return null;
    var list = alertList(); if (!list.length) return null;
    var tot = list.reduce(function (a, x) { return a + x.o.total; }, 0);
    return h('div', { class: 'card pad stack', style: 'border-color:var(--due)' },
      h('h3', { text: '⚠ ' + fmt(list.length) + ' জনের চাঁদা বাকি' }),
      h('p', { class: 'hint num', text: 'মোট ' + taka(tot) + '। সবার নামে একটা ফটোকার্ড বানিয়ে সমিতির গ্রুপে পাঠানো যাবে।' }),
      h('div', { class: 'acts' }, h('button', { class: 'btn primary', text: 'এলার্ট ফটোকার্ড বানান', onclick: function () { go('alert'); } })));
  }

  /* ---------- auth ---------- */
  function doLogin(e) {
    e.preventDefault();
    if (!auth) return;
    var btn = $('#li-go'); btn.disabled = true;
    auth.signInWithEmailAndPassword(($('#li-email').value || '').trim(), $('#li-pass').value).then(function () {
      delete S.drafts['li-pass']; toast('লগইন হয়েছে');
    }, function (err) {
      var c = err && err.code || '';
      toast(c.indexOf('network') >= 0 ? 'নেট সংযোগ নেই।' : c.indexOf('too-many') >= 0 ? 'অনেকবার ভুল হয়েছে, একটু পরে চেষ্টা করুন।' : 'ইমেইল বা পাসওয়ার্ড ভুল।');
    }).then(function () { btn.disabled = false; });
  }

  /* ---------- live data ---------- */
  function onErr() { S.err = 'সংযোগে সমস্যা হচ্ছে। নেট আছে কিনা দেখে অ্যাপটি আবার খুলুন।'; renderAll(); }
  function listenSociety(sid) {
    ['m', 'd', 'e'].forEach(function (k) { if (unsubs[k]) { unsubs[k](); unsubs[k] = null; } });
    S.members = []; S.deposits = {}; S.expenses = []; S.ready.m = false; S.ready.d = false; S.ready.e = false;
    if (!sid) { schedule(); return; }
    var b = db.collection('societies').doc(sid);
    unsubs.m = b.collection('members').onSnapshot(function (snap) {
      S.members = snap.docs.map(function (d) {
        var x = d.data() || {};
        return { id: d.id, name: String(x.name || ''), phone: String(x.phone || ''), monthly: Number(x.monthly) || 0, start: String(x.start || CUR), active: x.active !== false, pausedFrom: String(x.pausedFrom || ''), order: Number(x.order) || 0 };
      }).sort(function (a, c) { return a.order - c.order; });
      S.ready.m = true; S.err = ''; schedule();
    }, onErr);
    unsubs.d = b.collection('deposits').onSnapshot(function (snap) {
      var map = {};
      snap.docs.forEach(function (d) {
        var x = d.data() || {};
        map[d.id] = { memberId: String(x.memberId || ''), month: String(x.month || ''), amount: Number(x.amount) || 0, at: Number(x.at) || 0,
          log: Array.isArray(x.log) ? x.log.map(function (e) { return { a: Number(e && e.a) || 0, at: Number(e && e.at) || 0 }; }) : null };
      });
      S.deposits = map; S.ready.d = true; S.err = ''; schedule();
    }, onErr);
    unsubs.e = b.collection('expenses').onSnapshot(function (snap) {
      S.expenses = snap.docs.map(function (d) {
        var x = d.data() || {};
        return { id: d.id, type: x.type === 'in' ? 'in' : 'out', title: String(x.title || ''), amount: Number(x.amount) || 0, date: String(x.date || ''), at: Number(x.at) || 0 };
      }).sort(function (a, c) { return c.at - a.at; });
      S.ready.e = true; S.err = ''; schedule();
    }, onErr);
  }
  function checkLegacy() {
    if (!db || !S.canEdit || S.legacy || !S.ready.s || S.societies.length) return;
    db.collection('members').limit(1).get().then(function (q) { if (!q.empty) { S.legacy = true; schedule(); } }, function () {});
  }
  function start() {
    var cfg = window.FIREBASE_CONFIG;
    if (!window.firebase || !cfg || !cfg.apiKey || String(cfg.apiKey).indexOf('PASTE') === 0) {
      S.err = !window.firebase ? 'ইন্টারনেট সংযোগ নেই, তাই অ্যাপ চালু হয়নি।' : 'firebase-config.js ফাইলে Firebase-এর তথ্য এখনো বসানো হয়নি।';
      renderAll(); return;
    }
    try {
      firebase.initializeApp(cfg);
      db = firebase.firestore(); auth = firebase.auth();
      try { db.enablePersistence({ synchronizeTabs: true }).catch(function () {}); } catch (e) {}
    } catch (e) { S.err = 'Firebase চালু করা যায়নি। firebase-config.js ফাইলের তথ্য ঠিক আছে কিনা দেখুন।'; renderAll(); return; }
    auth.onAuthStateChanged(function (u) { S.canEdit = !!u; if (!u) { S.showAdd = false; S.em = null; S.editRow = null; S.confirm = null; } checkLegacy(); schedule(); });
    db.collection('societies').onSnapshot(function (snap) {
      S.societies = snap.docs.map(function (d) { var x = d.data() || {}; return { id: d.id, name: String(x.name || 'সমিতি'), createdAt: Number(x.createdAt) || 0 }; }).sort(function (a, b) { return a.createdAt - b.createdAt; });
      S.ready.s = true; S.err = '';
      var ids = S.societies.map(function (s) { return s.id; }), saved = lsGet('somiti_sid');
      var want = S.sid && ids.indexOf(S.sid) >= 0 ? S.sid : (saved && ids.indexOf(saved) >= 0 ? saved : (ids[0] || null));
      if (want !== S.sid) { S.sid = want; S.confirm = null; listenSociety(want); }
      checkLegacy(); schedule();
    }, onErr);
  }

  window.addEventListener('online', function () { S.online = true; schedule(); });
  window.addEventListener('offline', function () { S.online = false; schedule(); });
  window.addEventListener('hashchange', function () {
    var p = location.hash.slice(1);
    if (PAGES.indexOf(p) >= 0 && p !== S.page) { if (p === 'member' && !S.memberId) p = 'members'; S.page = p; S.confirm = null; S.editRow = null; renderAll(); window.scrollTo(0, 0); }
  });
  $('#soc-select').addEventListener('change', function (e) { selectSociety(e.target.value); });
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });

  var p0 = location.hash.slice(1); if (PAGES.indexOf(p0) >= 0 && p0 !== 'member') S.page = p0;
  renderAll();
  start();
})();
</script>
</body>
</html>
